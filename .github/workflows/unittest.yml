name: Python CI

on:
    push:
        branches:
           - main
    pull_request:
        branches:
           - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
     # step 1
      - name: Check out code
        uses: actions/checkout@v4

    #  step 2
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
           python-version: '3.14'

    #  step 3
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip 
            pip install -r requirements.txt

    #  step 4
      - name: Run tests
        run: pytest

     


